<!doctype html>
<html lang="zh-Hant">
<head>

  <title>正在返回 ZiZi App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f4ef;
      color: #3b2f2f;
    }

    main {
      width: min(92vw, 420px);
      padding: 32px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 40px rgba(59, 47, 47, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: #6c6060;
    }
  </style>
</head>
<body>
  <main>
    <h1>正在返回 ZiZi App</h1>
    <p>如果沒有自動跳回 App，請確認你已安裝最新版 ZiZi，然後回到 App 重新嘗試登入。</p>
  </main>
